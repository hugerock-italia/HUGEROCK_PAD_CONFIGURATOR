name: kat1_configurator
description: HugeRock KAT1 Configurator
publish_to: none

version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.31.10
  permission_handler: ^12.0.1
  geolocator: ^9.0.2
  wakelock_plus: ^1.1.0
  shared_preferences: ^2.2.2
  http: ^1.2.0
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/hugerock_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/app_icon.png"
# managed by Claude Code agents
